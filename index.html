<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de instalación de material</title>
<style>
  :root{--navy:#1f3a5f;--blue:#2f6db5;--bg:#f3f4f6;--line:#d5d9e0;--text:#1f2933;--muted:#6b7280;--ok:#2e7d4f;--err:#b3382c}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--navy);color:#fff;padding:16px 20px}
  header h1{margin:0;font-size:18px;font-weight:600}
  main{max-width:560px;margin:20px auto;padding:0 14px}
  form{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}
  label:first-of-type{margin-top:0}
  input{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;font-size:15px;background:#fff;color:var(--text)}
  input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  #preview{display:none;max-width:100%;max-height:220px;margin-top:10px;border:1px solid var(--line);border-radius:4px}
  button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:4px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:var(--navy)}
  button:disabled{opacity:.6;cursor:wait}
  #msg{margin-top:14px;font-size:14px;text-align:center;min-height:20px}
  .ok{color:var(--ok)}.err{color:var(--err)}
  #pend{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
  .ac{position:relative}
  .ac-list{position:absolute;left:0;right:0;top:100%;z-index:10;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 4px 4px;max-height:220px;overflow-y:auto;box-shadow:0 4px 10px rgba(0,0,0,.08);display:none}
  .ac-list div{padding:10px;font-size:14px;cursor:pointer;border-bottom:1px solid #eef0f3}
  .ac-list div:hover{background:#e8f0fb}
  .ac-list small{color:var(--muted);margin-left:6px}
</style>
</head>
<body>
<header><h1>Registro de instalación de material</h1></header>
<main>
<form id="form">
  <label for="nombre">Nombre</label>
  <div class="ac"><input id="nombre" required autocomplete="off"><div class="ac-list"></div></div>

  <div class="row">
    <div><label for="cargo">Cargo</label><div class="ac"><input id="cargo" required autocomplete="off"><div class="ac-list"></div></div></div>
    <div><label for="fecha">Fecha</label><input id="fecha" type="date" required></div>
  </div>

  <label for="punto">Punto de venta</label>
  <div class="ac"><input id="punto" required autocomplete="off"><div class="ac-list"></div></div>

  <div class="row">
    <div><label for="material">Tipo de material</label><div class="ac"><input id="material" required autocomplete="off"><div class="ac-list"></div></div></div>
    <div><label for="cantidad">Cantidad</label><input id="cantidad" type="number" min="1" step="1" required></div>
  </div>

  <label for="foto">Foto</label>
  <input id="foto" type="file" accept="image/*" capture="environment">
  <img id="preview" alt="Vista previa">

  <button id="btn" type="submit">Guardar registro</button>
  <div id="msg"></div>
  <div id="pend"></div>
</form>
</main>

<script>
/* ===== CONFIGURACIÓN: pega aquí las 2 URL de tus flujos de Power Automate ===== */
const CONFIG = {
  urlMaestros: "https://defaultc69af4b4d53d465abdcf7041701dc8.79.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/17/workflows/bb0175226c5e41519e399294c61e120b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=4ZPL-gSDnrGlWpe2tE5-O57IhMUsn2gwhB4EYPBHDo8",
  urlGuardar: "https://defaultc69af4b4d53d465abdcf7041701dc8.79.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/18/workflows/c50ea28f6e3e4af7885b3bc04e7232c0/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=TvFPIRj-1Lm-KFZ6ojyOCkWzF0HbNIeJHXU9r40iRfI"
};
/* ========================================================================== */

const $ = id => document.getElementById(id);
const norm = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const QKEY = "registros_pendientes", CKEY = "catalogo";
let CAT = {nombres:[], cargos:[], puntos:[], materiales:[]};
try{ CAT = JSON.parse(localStorage.getItem(CKEY)) || CAT; }catch(e){}

/* ---------- Lee Tbl_Maestros ---------- */
async function cargarCatalogo(){
  try{
    const r = await fetch(CONFIG.urlMaestros, {method:"POST", body:"{}"});
    if(!r.ok) throw new Error(r.status);
    const rows = await r.json();
    const val = (row, n) => { const k = Object.keys(row).find(k=>norm(k)===norm(n)); return k ? String(row[k]??"").trim() : ""; };
    const uniq = a => [...new Set(a.filter(Boolean))];
    CAT = {
      nombres: rows.map(x=>({n:val(x,"Nombre"), c:val(x,"Cargo")})).filter(x=>x.n),
      cargos: uniq(rows.map(x=>val(x,"Cargo"))),
      puntos: uniq(rows.map(x=>val(x,"Punto de venta"))),
      materiales: uniq(rows.map(x=>val(x,"Material")))
    };
    try{ localStorage.setItem(CKEY, JSON.stringify(CAT)); }catch(e){}
  }catch(e){ console.error("Maestros:", e); }
}

/* ---------- Guarda en Tbl_Registros (vía flujo) ---------- */
async function enviar(d){
  const now = new Date(), p = n=>String(n).padStart(2,"0");
  const payload = {
  fechaRegistro: `${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`,
  nombre: d.nombre,
  cargo: d.cargo,
  fecha: d.fecha,
  punto: d.punto,
  material: d.material,
  cantidad: Number(d.cantidad),
  archivoFoto: d.foto
      ? (d.punto + "_" + d.fecha + "_" + Date.now() + ".jpg").replace(/[^\w.-]/g, "_")
      : "Sin foto",
  fotoBase64: d.foto
      ? d.foto.split(",")[1]
      : ""
};
  const r = await fetch(CONFIG.urlGuardar, {method:"POST", body:JSON.stringify(payload)});
  if(!r.ok) throw new Error("HTTP "+r.status);
}

/* ---------- Autocompletado ---------- */
function autocompletar(input, fuente, alElegir){
  const list = input.parentElement.querySelector(".ac-list");
  function mostrar(){
    const q = norm(input.value);
    const items = fuente().filter(i=>!q || norm(i.t).includes(q))
      .sort((a,b)=>norm(b.t).startsWith(q)-norm(a.t).startsWith(q)).slice(0,8);
    list.innerHTML = "";
    items.forEach(i=>{
      const d = document.createElement("div");
      d.textContent = i.t;
      if(i.s){ const s = document.createElement("small"); s.textContent = i.s; d.appendChild(s); }
      d.addEventListener("pointerdown", e=>{ e.preventDefault(); input.value=i.t; list.style.display="none"; if(alElegir) alElegir(i); });
      list.appendChild(d);
    });
    list.style.display = items.length ? "block" : "none";
  }
  input.addEventListener("input", mostrar);
  input.addEventListener("focus", mostrar);
  input.addEventListener("blur", ()=>setTimeout(()=>list.style.display="none",150));
}
autocompletar($("nombre"), ()=>CAT.nombres.map(x=>({t:x.n,s:x.c,c:x.c})), i=>{ if(i.c) $("cargo").value=i.c; });
autocompletar($("cargo"), ()=>CAT.cargos.map(t=>({t})));
autocompletar($("punto"), ()=>CAT.puntos.map(t=>({t})));
autocompletar($("material"), ()=>CAT.materiales.map(t=>({t})));

/* ---------- Foto ---------- */
function comprimir(file, max=1000, q=0.7){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = img.width*k; c.height = img.height*k;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
$("foto").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  $("preview").src = URL.createObjectURL(f); $("preview").style.display = "block";
});

/* ---------- Cola sin conexión ---------- */
const getQ = ()=>{ try{return JSON.parse(localStorage.getItem(QKEY)||"[]")}catch(e){return []} };
const setQ = q=>{ try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){} showPend(); };
function showPend(){ const n=getQ().length; $("pend").textContent = n ? `${n} registro(s) pendiente(s) de envío` : ""; }
async function reenviarPendientes(){
  const resto = [];
  for(const d of getQ()){ try{ await enviar(d); }catch(e){ resto.push(d); } }
  setQ(resto);
}


/* ---------- Formulario ---------- */
$("fecha").valueAsDate = new Date();
$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=$("btn"), msg=$("msg");
  btn.disabled = true; msg.className=""; msg.textContent="Guardando…";
  try{
    const data = {
      nombre:$("nombre").value.trim(), cargo:$("cargo").value.trim(), fecha:$("fecha").value,
      punto:$("punto").value.trim(), material:$("material").value.trim(), cantidad:$("cantidad").value,
      foto: archivoFoto ? await comprimir(archivoFoto) : null
    };
    try{
      await enviar(data);
      msg.className="ok"; msg.textContent="Registro guardado correctamente.";
    }catch(err){
      console.error(err);
      setQ([...getQ(), data]);
      msg.className="err"; msg.textContent="No se pudo enviar: quedó guardado en este dispositivo y se reintentará.";
    }
    $("punto").value=""; $("material").value=""; $("cantidad").value="";
    $("foto").value=""; $("preview").style.display="none";
  }catch(err){
    msg.className="err"; msg.textContent="No se pudo procesar la foto. Inténtalo de nuevo.";
  }
  btn.disabled = false;
});

/* ---------- Inicio ---------- */
showPend();
cargarCatalogo().then(reenviarPendientes);
window.addEventListener("online", reenviarPendientes);
</script>
</body>
</html>
